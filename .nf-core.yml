repository_type: pipeline

nf_core_version: 4.0.2

lint:
  schema_lint: false # This pipeline uses --caseJointVCF/--caseSample/etc. instead of the standard --input samplesheet, so the built-in "input" parameter check doesn't apply here.
  nextflow_config:
    - params.input # Same reason as schema_lint above: no standard --input samplesheet in this pipeline.
  nf_test_content:
    - versions.yml # This pipeline doesn't track/emit software versions (no versions.yml is produced), so the default test can't snapshot one.
  files_exist:
    - .github/workflows/linting_comment.yml
  files_unchanged:
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml

template:
  org: nf-core
  name: rarevariantburden
  description: This pipeline include tools for performing consistent summary
    count based rare variant burden test, which is useful when we only have
    sequenced cases data, no control data; here we can compare the cases against
    public summary count data, such as gnomAD data
  author: Saima Sultana Tithi
  version: 1.0.0dev
  force: true
  outdir: .
  is_nfcore: true
